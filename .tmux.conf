set -g mouse on
set -g focus-events on
set -g status-right ''
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g extended-keys-format csi-u

# M-a integration with Neovim.  When the active pane is Neovim this forwards
# the key back to Neovim; from an adjacent agent pane it pulls the current
# Neovim file reference into that pane.
bind-key -n M-a run-shell -b "$HOME/.config/tmux/nvim-ai-reference.sh --meta-a"

# Remove detached sessions, then close the current session and all its windows.
bind-key -n M-q run-shell "zsh -ic tmux-kd" \; kill-session

# Do not bind M-b in tmux: Option-Left sends M-b/ESC-b for shell backward-word.
unbind-key -q -n M-b

# Colors: terminal palette names only, never hex. "default" is the terminal's
# own foreground/background and blue/yellow/red are its ANSI colors, so tmux
# follows whatever theme ~/.config/theme applied to Ghostty (light or dark)
# without being told. The tmux defaults (green status bar, yellow messages)
# clash with light themes.
set -g status-style 'bg=default,fg=default'
set -g window-status-style 'fg=default'
set -g window-status-current-style 'fg=blue,bold'
set -g window-status-activity-style 'fg=yellow'
set -g window-status-bell-style 'fg=red,bold'
set -g message-style 'bg=default,fg=blue,bold'
set -g message-command-style 'bg=default,fg=blue'
set -g mode-style 'reverse'
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=blue'
