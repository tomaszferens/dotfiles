set -g mouse on
set -g focus-events on
set -g status-right ''
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g extended-keys-format csi-u

# M-a integration with Neovim.  When the active pane is Neovim this forwards
# the key back to Neovim; from an adjacent agent pane it pulls the current
# Neovim file reference into that pane.
bind-key -n M-a run-shell -b "$HOME/.config/tmux/nvim-ai-reference.sh --meta-a"

# Remove detached sessions, then close the current session and all its windows.
bind-key -n M-q run-shell "zsh -ic tmux-kd" \; kill-session

# Do not bind M-b in tmux: Option-Left sends M-b/ESC-b for shell backward-word.
unbind-key -q -n M-b

# Pane borders
set -g pane-border-style 'fg=#565f89'
set -g pane-active-border-style 'fg=#7aa2f7'
