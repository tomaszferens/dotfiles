onboarding = false
[ui]
agent_panel_sort = "spaces"

# Direct alt chords (no prefix) — herdr grabs them before panes see them.
# Neovim maps already use alt+h/n/o/s/t/b/f/,/. so those are avoided; j/k, u/i,
# and digits are free. Same motion at two scopes: alt = agents, alt+shift =
# spaces; u/i (above j/k) cycle tabs left/right. alt+u/i replace the default
# prefix+p/prefix+n tab bindings.
# WezTerm owns alt+1..9 and alt+shift+j/k for itself; herdr_passthrough in
# wezterm.lua forwards them here whenever the focused WezTerm pane runs herdr.
[keys]
next_agent = "alt+j"
previous_agent = "alt+k"
next_tab = "alt+i"
previous_tab = "alt+u"
focus_agent = "alt+1..9"
next_workspace = "alt+shift+j"
previous_workspace = "alt+shift+k"
switch_workspace = "prefix+alt+1..9"

# alt+a: two-way file-reference bridge with the workspace's Neovim.
# Direct chord — herdr intercepts it before panes see it; the script branches
# on the focused pane (Neovim vs agent). See nvim-ai-bridge.sh in this dir.
[[keys.command]]
key = "alt+a"
type = "shell"
command = "$HOME/.config/herdr/nvim-ai-bridge.sh"

# prefix+shift+s / prefix+shift+l: rebuild the focused workspace's tabs from a
# profile in layout.sh (mobile: zsh, mobile, dev, neovim, LLM; generic: zsh,
# nvim, llm). Every existing tab in that workspace is closed first, which kills
# whatever runs in it, so the result is always exactly the profile's tabs.
# Prefix chords on purpose: it is destructive, and WezTerm/Ghostty never see
# the second key of a prefix chord, so no passthrough is needed.
[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "$HOME/.config/herdr/layout.sh mobile"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "$HOME/.config/herdr/layout.sh generic"

# alt+shift+c: flip between the last light and last dark theme in Ghostty,
# herdr, every running Neovim and Claude Code (~/.config/theme/toggle.sh).
# alt+shift+o: fzf theme picker with live preview (~/.config/theme/pick.sh).
[[keys.command]]
key = "alt+shift+c"
type = "shell"
command = "$HOME/.config/theme/toggle.sh"

[[keys.command]]
key = "alt+shift+o"
type = "popup"
command = "$HOME/.config/theme/pick.sh"
width = 50
height = 20

# Theme ([theme], [theme.custom], [ui.sidebar.agents]) is managed by
# ~/.config/theme/apply.sh: it replaces everything between these markers
# with ~/.config/theme/themes/<name>/herdr.toml. Edit those files, not this block.
# >>> theme-toggle
[theme]
name = "tokyo-night"
auto_switch = false

# surface_dim paints the active space/agent row background in the sidebar;
# stock tokyo-night makes it near-invisible. Tokyo Night selection blue.
# text is the active/emphasized foreground — full white for contrast on it.
[theme.custom]
surface_dim = "#283457"
text = "#ffffff"

# Default agent rows use overlay0 (#565f89) for the tab and agent-name text,
# which is unreadable on the surface_dim active-row bar. Same layout as the
# default, with an explicit readable foreground on those tokens.
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#a9b1d6" }],
  [{ token = "agent", fg = "#a9b1d6" }],
]
# <<< theme-toggle
